<!DOCTYPE html>
<html lang='ko'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<title>JINIVERSE · 진짜 나의 우주를 찾는 16가지 궤도</title>
<meta name='description' content='70개의 일상 장면으로 당신이 도는 16개의 궤도를 찾는 JINIVERSE 성격 유형 검사'>
<meta name='theme-color' content='#050507'>
<link rel='stylesheet' href='https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css'>
<style>
:root{--bg:#050507;--tx:#F2F3F7;--mu:rgba(242,243,247,.62);--dim:rgba(242,243,247,.38);--a:#8B7CFF;--b:#3DD6E0;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);--warn:#F5C26B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:'';position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(40% 35% at 18% 12%,rgba(139,124,255,.32),transparent 70%),radial-gradient(38% 32% at 88% 78%,rgba(61,214,224,.20),transparent 70%),radial-gradient(30% 25% at 70% 20%,rgba(255,120,200,.10),transparent 70%);filter:blur(30px)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;background-image:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 78% 12%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 62% 44%,#d9d3ff 50%,transparent 51%),radial-gradient(1px 1px at 28% 72%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 88% 56%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 45% 90%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 6% 52%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 94% 88%,#c9f6ff 50%,transparent 51%),radial-gradient(1px 1px at 36% 8%,#fff 50%,transparent 51%)}
main{max-width:640px;margin:0 auto;padding:40px 20px 100px;position:relative;z-index:1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.pad{padding:24px}
.eb{font-size:12px;letter-spacing:.14em;color:var(--dim)}
.mu{color:var(--mu)}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;color:var(--mu);padding:7px 14px;border-radius:999px}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a)}
h1{font-size:40px;font-weight:700;line-height:1.25;letter-spacing:-.03em;margin:22px 0 16px;background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.lead{color:var(--mu);font-size:16px;line-height:1.75}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 30px}
.chip{font-size:13px;color:var(--mu);padding:7px 13px;border-radius:999px}
.cta{display:block;width:100%;height:58px;border-radius:16px;background:#fff;color:#08080b;font-size:16px;font-weight:700;transition:transform .15s,box-shadow .2s;box-shadow:0 8px 30px rgba(139,124,255,.25)}
.cta:hover{box-shadow:0 10px 40px rgba(139,124,255,.4)}
.cta:active{transform:scale(.98)}
.sub{display:block;width:100%;height:52px;border-radius:16px;font-size:15px;margin-top:10px;transition:border-color .2s,background .2s}
.sub:hover{border-color:var(--line2);background:var(--glass2)}
.back{color:var(--mu);font-size:14px;padding:6px 0}
.back:hover{color:var(--tx)}
.hr{height:1px;background:var(--line);border:0;margin:40px 0}
.li{display:flex;gap:14px;font-size:15px;line-height:1.7;padding:14px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li b{color:var(--a);font-weight:600;min-width:22px}
.foot{font-size:12px;color:var(--dim);line-height:1.7;margin-top:32px}
.segs{display:flex;gap:4px}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.seg>i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .35s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0 30px}
.opt{border-radius:16px;padding:16px;font-size:15px;line-height:1.55;transition:all .25s;position:relative;text-align:left;width:100%;cursor:pointer}
.opt:hover{border-color:var(--line2)}
.opt .k{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;margin-bottom:6px}
.opt.A .k{color:var(--a)}.opt.B .k{color:var(--b)}
.opt.A.lean{border-color:rgba(139,124,255,.7);background:rgba(139,124,255,.12)}
.opt.B.lean{border-color:rgba(61,214,224,.7);background:rgba(61,214,224,.10)}
.scale{display:flex;justify-content:space-between;align-items:center;max-width:420px;margin:0 auto}
.dot{border-radius:50%;border:1.5px solid;transition:all .18s;flex:none;background:transparent}
.dot:hover{transform:scale(1.08)}
.dot.on{transform:scale(1.05)}
.scl{display:flex;justify-content:space-between;max-width:440px;margin:12px auto 0;font-size:12px;color:var(--dim)}
.fade{animation:fd .4s cubic-bezier(.2,.8,.2,1)}
@keyframes fd{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pledge{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:16px;margin-bottom:10px;cursor:pointer;font-size:15px;line-height:1.55;transition:all .2s}
.pledge.on{border-color:rgba(139,124,255,.6);background:rgba(139,124,255,.10)}
.pledge input{accent-color:var(--a);width:18px;height:18px;margin:2px 0 0;flex:none}
.err{color:#FF8E8E;font-size:13px;min-height:18px;margin-top:10px}
.cmp{padding:18px 0;border-top:1px solid var(--line)}
.cmp .x{color:var(--dim);text-decoration:line-through;font-size:14px;line-height:1.6;margin-top:6px}
.cmp .o{font-size:14px;line-height:1.6;margin-top:4px}
.pop{border-radius:999px;padding:11px 18px;font-size:15px;margin:0 8px 8px 0;transition:all .2s}
.pop.on{border-color:rgba(139,124,255,.7);background:rgba(139,124,255,.14)}
.code{font-size:76px;font-weight:800;letter-spacing:.1em;line-height:1;margin:16px 0 10px;background:linear-gradient(90deg,#fff,#d9d3ff 50%,#c9f6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--mu)}
.tag.w{border-color:rgba(245,194,107,.6);color:var(--warn)}
.bar{height:8px;border-radius:8px;overflow:hidden;display:flex;background:rgba(255,255,255,.06)}
.bar>.l{background:var(--a)}.bar>.r{background:var(--b);flex:1;opacity:.85}
.fac{display:grid;grid-template-columns:92px 1fr 20px;gap:12px;align-items:center;margin:12px 0;font-size:13px}
.ev{border-left:2px solid var(--a);padding:2px 0 2px 12px;margin:12px 0;font-size:14px;line-height:1.6}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.metric{padding:16px;border-radius:16px}
.metric p+p{font-size:24px;font-weight:700;margin-top:4px}
.g16{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.tb,.cmb{text-align:left;padding:14px;border-radius:16px;line-height:1.45;transition:all .2s}
.tb:hover,.tb.on,.cmb:hover,.cmb.on{border-color:rgba(139,124,255,.7);background:rgba(139,124,255,.10)}
.sec{padding:18px 0;border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:18px 0}
.nav{position:sticky;top:12px;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:6px;border-radius:999px;margin:20px 0 8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;font-size:13px;color:var(--mu);padding:8px 14px;border-radius:999px;transition:all .2s}
.nav button:hover{color:var(--tx);background:var(--glass2)}
.letters{display:flex;gap:18px;font-size:13px;color:var(--mu);margin-bottom:22px}
.shareimg{width:100%;max-width:280px;display:block;margin:16px auto 0;border-radius:18px;border:1px solid var(--line)}
@media(max-width:480px){h1{font-size:32px}.code{font-size:58px}.two{grid-template-columns:1fr}.opt{padding:13px;font-size:14px}.pad{padding:20px}}
</style>
</head>
<body>
<main id='app'></main>
<script>
const Q=[['EI1','E','한 주 내내 일이 몰아쳤던 금요일 저녁, 지친 나를 회복시키는 건','누군가를 만나 실컷 떠들어야 비로소 풀린다','아무도 없는 내 공간에서 조용히 쉬어야 풀린다'],['EI1','I','하루 종일 미팅과 행사로 사람을 만난 날, 집에 돌아온 직후 내 상태는','배터리가 바닥이라 일단 혼자 조용히 충전해야 한다','오히려 텐션이 올라 있어 누구와 더 얘기하고 싶다'],['EI1','E','약속 없는 토요일 오후, 친한 친구가 ‘지금 나올래?’ 하고 연락했다','오 좋아, 바로 준비하고 나간다','반갑지만 오늘 집에서 쉬려던 계획이 먼저 떠오른다'],['EI1','I','아무 제약 없는 연휴 5일이 생겼다면','대부분을 혼자 또는 아주 가까운 한두 명과 느긋하게 보낸다','매일 다른 사람들과 약속을 잡아 알차게 채운다'],['EI2','E','복잡한 고민이 생겼을 때 나는 보통','누군가에게 말하다 보면 생각이 정리된다','혼자 충분히 정리한 뒤에야 남에게 말할 수 있다'],['EI2','I','회의에서 예상 못 한 질문을 받았다','잠깐 생각할 시간을 갖거나, 정리해서 나중에 답하고 싶다','말하면서 생각을 맞춰가며 바로 답하는 편이다'],['EI2','E','단톡방에서 내 의견을 물었다','떠오르는 대로 바로 보내고, 대화하며 다듬는다','생각을 다 정리한 뒤 한 번에 정돈된 메시지를 보낸다'],['EI2','I','좋은 아이디어가 떠올랐을 때','혼자 충분히 굴려본 뒤에 꺼내놓는다','바로 누군가에게 말하며 살을 붙인다'],['EI3','E','나의 인간관계를 그림으로 그린다면','넓게 퍼진 그물: 다양한 사람과 두루 아는 사이','작고 촘촘한 원: 소수와 깊게 아는 사이'],['EI3','I','지인의 지인들이 모인 처음 가는 모임에서 나는','아는 한두 명 곁에서 깊은 대화를 나눈다','이 사람 저 사람과 인사하며 자연스럽게 돌아다닌다'],['EI3','E','새 회사나 학교에 들어간 첫 주','먼저 말 걸고 점심 같이 먹자고 하며 빠르게 친해진다','분위기를 보며 자연스럽게 가까워질 사람이 생기길 기다린다'],['EI3','I','주말 약속을 하나만 고른다면','오랜 친구 한 명과 카페에서 3시간 대화','여러 무리가 섞인 바비큐 파티에서 3시간'],['EI4','E','일이나 공부를 할 때 집중이 잘 되는 곳','적당히 사람 소리가 나는 카페나 열린 공간','조용하고 방해받지 않는 나만의 공간'],['EI4','I','생일 축하나 건배사로 모두의 시선이 나에게 쏠렸다','고맙지만 이 순간이 빨리 지나갔으면 좋겠다','은근히 즐긴다, 한마디 더 하고 싶어진다'],['EI4','E','급하지 않은 용건을 전할 때 더 편한 방법','전화나 음성으로 바로 주고받는 게 편하다','문자로 생각을 정리해서 보내는 게 편하다'],['EI4','I','여행지에서 자유 시간이 하루 생겼다','한적한 동네를 천천히 걸으며 혼자만의 시간을 갖는다','시장이나 축제처럼 북적이고 활기찬 곳을 누빈다'],['SN1','S','처음 가는 동네에서 밥집을 고를 때 더 믿는 것','리뷰 수, 별점, 실제 메뉴 사진 같은 구체적 정보','간판, 분위기, 골목에서 오는 ‘여기다’ 하는 느낌'],['SN1','N','누군가의 이야기를 들을 때 나는','말 사이에 숨은 의도나 맥락을 먼저 읽는다','실제로 한 말을 그대로 받아들이는 편이다'],['SN1','S','새로 산 가전이나 앱을 처음 쓸 때','기본 기능과 사용법부터 차근차근 확인한다','이것저것 눌러보며 전체 구조를 감으로 파악한다'],['SN1','N','중요한 판단을 내릴 때 결국 더 믿게 되는 쪽','설명하긴 어렵지만 강하게 오는 직감','직접 보고 겪어서 확인한 사실'],['SN1','S','친구가 ‘어제 만난 그 사람 어땠어?’ 하고 묻는다. 내 대답은 주로','키, 옷차림, 무슨 말을 했는지 같은 구체적인 묘사','‘뭔가 자유로운 영혼 같은 느낌?’ 같은 전체적인 인상'],['SN2','N','멍하니 있을 때 머릿속에 주로 떠오르는 것 const TY={ISTJ:['북극성','Polaris','변하지 않는 기준점','맡은 일은 끝까지, 약속한 건 반드시. 북극성처럼 늘 같은 자리에서 방향을 알려주는 사람이에요. 화려한 말보다 쌓아온 기록으로 신뢰를 얻고, 사실과 경험에 근거해 차분하게 판단해요. 혼란스러운 순간에 사람들은 자연스럽게 당신을 찾아요.',['책임감과 신뢰성','꼼꼼한 사실 확인','체계적인 실행력','흔들리지 않는 침착함'],['검증되지 않은 새로운 방식에 지나치게 신중할 수 있어요','마음을 행동으로만 표현해서 오해를 사기도 해요','원칙이 사람의 사정보다 앞설 때가 있어요'],'예측할 수 없는 변화가 몰아치면 더 단단히 규칙을 붙잡고, 모든 걸 혼자 떠안으려 해요.','말보다 꾸준함으로 사랑을 표현해요. 기념일을 잊지 않고 약속 시간을 지키는 것이 당신의 고백이에요.','역할과 기준이 분명한 곳에서 빛나요. 품질 관리, 재무, 운영, 법률·행정처럼 정확성이 생명인 일과 잘 맞아요.','가끔은 ‘원래 이렇게 해’ 대신 ‘다르게 하면 어떨까?’를 실험해 보세요. 안정감에 유연함이 더해지면 무적이에요.'],ISFJ:['달','The Moon','조용히 곁을 비추는 수호자','스스로를 내세우기보다 주변을 은은하게 비추는 사람이에요. 누가 무엇을 좋아하는지, 어제 기분이 어땠는지 조용히 기억해 두고 필요한 순간에 손을 내밀어요. 성실하고 따뜻해서, 당신이 있는 곳은 늘 안정적으로 돌아가요.',['세심한 배려와 기억력','묵묵한 성실함','실질적인 도움','안정감을 주는 존재감'],['부탁을 거절하지 못해 혼자 지치기 쉬워요','내 필요를 자꾸 뒤로 미뤄요','갈등을 피하려다 서운함이 쌓이기도 해요'],'도움이 당연하게 여겨진다고 느낄 때 조용히 지치고, 서운함을 속으로 삭여요.','작은 디테일로 사랑을 증명해요. 상대의 취향을 기억하고 챙기는 것이 당신의 언어예요.','사람을 실질적으로 돕는 일에서 보람을 느껴요. 간호·의료, 교육, 고객 지원, 인사·행정과 잘 맞아요.','‘아니요’도 배려의 한 형태예요. 당신을 지키는 경계가 있어야 오래 비출 수 있어요.'],INFJ:['성운','Nebula','보이지 않는 곳에서 별을 빚는 사람','겉으로는 고요하지만 안에서는 끊임없이 별이 태어나는 성운 같은 사람이에요. 사람과 상황의 숨은 흐름을 읽어내고, 그것이 어떤 의미인지 깊이 생각해요. 소수와 깊이 연결되기를 원하고, 세상이 조금 더 나아지는 방향에 마음이 움직여요.',['깊은 통찰력','속마음을 읽는 공감','의미를 향한 집념','조용하지만 강한 신념'],['기대가 높아 스스로와 타인에게 엄격해질 수 있어요','속마음을 잘 드러내지 않아 오해받기도 해요','한계에 다다르면 갑자기 관계의 문을 닫기도 해요'],'감정을 너무 많이 흡수하면 혼자 동굴로 들어가 모든 연락을 끊고 싶어져요.','깊이 없는 관계엔 금방 지쳐요. 내면을 나눌 수 있는 한 사람이 열 명의 지인보다 소중해요.','의미 있는 목표를 위해 사람을 이해하는 일이 잘 맞아요. 상담, 글쓰기, 교육, 기획, 사회 혁신 분야에서 빛나요.','완벽한 때를 기다리지 말고 생각을 조금 일찍 꺼내 보세요. 당신의 통찰은 나눌수록 커져요.'],INTJ:['궤도 설계자','Orbit Architect','먼 미래의 궤적을 계산하는 전략가','몇 수 앞을 내다보며 궤도를 계산하는 전략가예요. 복잡한 문제 속에서 구조를 찾아내고, 장기 목표를 세워 효율적으로 밀고 나가요. 남들이 ‘원래 그래’라고 할 때 더 나은 방법을 설계하는 사람이에요.',['장기적 비전과 전략','독립적인 사고','복잡한 문제의 구조화','목표를 향한 추진력'],['논리가 맞으면 감정은 부차적이라 여겨 차갑게 보일 수 있어요','남의 속도를 답답해할 때가 있어요','혼자 다 계획해 버려 협업이 어려워지기도 해요'],'통제할 수 없는 비효율에 둘러싸이면 냉소적이 되고, 평소와 달리 사소한 감각적 즐거움에 과하게 빠지기도 해요.','말보다 신뢰와 성장으로 관계를 쌓아요. 함께 더 나은 미래를 설계할 파트너를 원해요.','자율성과 지적 도전이 있는 곳에서 몰입해요. 전략 기획, 연구, 엔지니어링, 데이터·시스템 설계와 잘 맞아요.','계획에 ‘사람의 마음’이라는 변수를 넣어 보세요. 그게 계산의 정확도를 오히려 높여 줘요.'],ISTP:['탐사 로버','Rover','직접 만져보고 해결하는 현장 탐사가','설명서보다 직접 만져보며 원리를 파악하는 현장 탐사가예요. 위기에서 오히려 침착해지고, 필요한 만큼만 말하며 효율적으로 문제를 해결해요. 자유롭게 움직일 공간이 있을 때 실력이 가장 잘 나와요.',['위기 대처 능력','손으로 익히는 실전 감각','군더더기 없는 효율','독립성과 적응력'],['감정 표현이 적어 무심해 보일 수 있어요','긴 계획이나 반복 업무에 쉽게 흥미를 잃어요','속박을 느끼면 말없이 거리를 두기도 해요'],'감정적인 압박이 계속되면 갑자기 터지거나 완전히 혼자가 되려 해요.','함께 무언가를 하는 시간으로 가까워져요. 말 대신 고장 난 걸 고쳐주는 게 당신식 애정이에요.','직접 다루고 고치고 만드는 일이 잘 맞아요. 엔지니어링, 정비, 개발, 응급·보안, 스포츠 분야에서 빛나요.','느낀 걸 한 문장이라도 말로 꺼내 보세요. 사람들은 당신의 생각을 생각보다 궁금해해요.'],ISFP:['오로라','Aurora','조용히 피어나는 감각의 예술가','조용히, 그러나 누구보다 선명한 색으로 피어나는 사람이에요. 지금 이 순간의 아름다움을 예민하게 느끼고, 자기만의 취향과 가치를 소중히 지켜요. 다정하지만 강요하지 않고, 각자의 모습을 있는 그대로 존중해요.',['뛰어난 미적 감각','있는 그대로를 받아들이는 다정함','현재를 즐기는 능력','진정성 있는 표현'],['갈등을 피하려다 속마음을 숨기기 쉬워요','장기 계획 세우기를 미루곤 해요','비판을 개인적인 상처로 받아들일 때가 있어요'],'자기 가치가 무시당한다고 느끼면 조용히 마음을 닫고 멀어져요.','함께한 순간과 작은 선물로 마음을 전해요. 자유를 존중해 주는 사람에게 깊이 열려요.','감각과 진정성을 살리는 일이 잘 맞아요. 디자인, 예술, 요리, 사진, 자연·동물, 돌봄 분야에서 빛나요.','당신의 취향은 그 자체로 경쟁력이에요. 조금 더 큰 목소리로 세상에 보여줘도 돼요.'],INFP:['은하수','Milky Way','자기만의 의미를 품은 몽상가','겉으론 고요하지만 안에 수많은 이야기와 이상을 품은 은하수 같은 사람이에요. 자신에게 진짜 의미 있는 것을 따르고, 타인의 아픔에 깊이 공감해요. 세상이 정한 정답보다 내 마음이 납득하는 답을 찾아요.',['깊은 공감 능력','풍부한 상상력과 표현력','흔들리지 않는 가치관','타인의 가능성을 믿는 마음'],['이상과 현실의 차이에 쉽게 낙담할 수 있어요','현실적인 일 처리를 미루곤 해요','생각이 많아 행동이 늦어지기도 해요'],'자기 가치가 침해당하면 평소의 온화함과 달리 단호하고 날카로워져요.','영혼의 대화를 나눌 수 있는 관계를 꿈꿔요. 진심을 알아봐 주는 사람에게 모든 걸 내어줘요.','의미와 자율이 있는 일에서 몰입해요. 글쓰기, 콘텐츠, 상담, 교육, 예술, 사회적 가치를 다루는 일과 잘 맞아요.','완벽한 버전이 아니라 첫 번째 버전을 세상에 내놓아 보세요. 당신의 이야기를 기다리는 사람이 있어요.'],INTP:['웜홀','Wormhole','생각과 생각 사이 지름길을 찾는 탐구자','‘왜?’라는 질문을 멈추지 않는 탐구자예요. 세상의 원리를 이해할 때 가장 큰 기쁨을 느끼고, 생각과 생각 사이의 지름길을 찾아내요. 논리적으로 정확한 것을 사랑하고, 남들이 지나친 모순을 정확히 짚어내요.',['날카로운 분석력','독창적인 아이디어','끝없는 지적 호기심','편견 없는 객관성'],['아이디어를 끝까지 실행하는 데 약할 수 있어요','정확성을 따지다 상대의 감정을 놓치기도 해요','일상적인 일을 자꾸 뒤로 미뤄요'],'감정적인 상황에 몰리면 평소답지 않게 예민해지고, 생각 속으로 숨어요.','끝없는 대화를 즐길 수 있는 사람에게 끌려요. 관심 있는 주제를 함께 파고드는 시간이 애정 표현이에요.','복잡한 문제를 자율적으로 파고드는 일이 잘 맞아요. 연구, 개발, 데이터 분석, 과학, 시스템 설계 분야에서 빛나요.','80% 완성된 생각도 꺼낼 가치가 있어요. 세상의 피드백이 당신의 이론을 완성시켜 줘요.'],ESTP:['유성','Meteor','지금 이 순간을 가장 밝게 태우는 행동가','생각보다 몸이 먼저 움직이는 행동가예요. 현장의 분위기를 빠르게 읽어 기회를 잡고, 위기에서 순발력을 발휘해요. 유쾌하고 대담해서, 당신이 있으면 일이 재밌게 그리고 빠르게 굴러가요.',['빠른 상황 판단','대담한 실행력','유머와 친화력','위기 속 순발력'],['결과를 충분히 생각하기 전에 움직일 때가 있어요','길고 반복적인 프로젝트에 흥미를 잃기 쉬워요','직설적인 말이 가끔 상대를 놀라게 해요'],'지루함과 통제에 갇히면 충동적인 선택으로 탈출하려 해요.','함께 새로운 걸 경험하며 가까워져요. 긴 대화보다 같이 떠나는 즉흥 여행이 최고의 데이트예요.','속도감 있고 결과가 바로 보이는 일이 잘 맞아요. 영업, 창업, 마케팅, 스포츠, 현장 지휘, 응급 분야에서 빛나요.','움직이기 전에 딱 10초만 다음 수를 생각해 보세요. 실행력에 방향이 더해지면 멈출 수 없어요.'],ESFP:['초신성','Supernova','어디서든 빛나는 순간을 만드는 사람','사람과 함께하는 즐거움을 사랑하고, 주변의 기분을 단번에 끌어올리는 사람이에요. 오늘을 충실하게 사는 법을 알고, 그 에너지를 아낌없이 나눠요. 당신이 있는 자리는 자연스럽게 무대가 돼요.',['분위기를 살리는 에너지','현재를 즐기는 능력','따뜻한 친화력','실용적인 센스'],['장기 계획을 미루기 쉬워요','무거운 주제나 갈등을 피하고 싶어 해요','즉흥적인 소비나 선택을 하기도 해요'],'외로움과 비판이 겹치면 평소의 밝음이 꺼지고 미래에 대한 걱정에 빠져요.','함께 웃고 경험하는 시간이 사랑이에요. 상대가 즐거워하는 걸 보는 게 가장 행복해요.','사람과 에너지를 주고받는 일이 잘 맞아요. 서비스, 이벤트, 공연, 영업, 교육 분야에서 빛나요.','즐거움의 일부를 미래의 나에게 저축해 보세요. 내일의 당신도 빛날 권리가 있어요.'],ENFP:['혜성','Comet','가는 곳마다 영감의 꼬리를 남기는 사람','새로운 가능성을 발견하면 눈이 반짝이는 사람이에요. 사람들의 잠재력을 누구보다 먼저 알아보고, 따뜻한 열정으로 주변을 설레게 만들어요. 당신이 지나간 자리엔 아이디어와 웃음이 꼬리처럼 남아요.',['넘치는 아이디어와 열정','사람의 가능성을 보는 눈','뛰어난 소통력','변화에 대한 유연함'],['시작은 많고 마무리는 어려울 때가 있어요','관심이 여러 곳으로 흩어지기 쉬워요','반복적인 일에 금방 지쳐요'],'기대가 무너지면 평소와 달리 사소한 디테일에 집착하거나 스스로를 몰아세워요.','깊고 진솔한 대화와 함께 꿈꾸는 시간을 사랑해요. 상대의 성장을 진심으로 응원해요.','아이디어와 사람이 만나는 일에서 빛나요. 기획, 마케팅, 콘텐츠, 교육, 상담, 창업과 잘 맞아요.','열 개의 시작보다 하나의 완성이 더 멀리 날아가요. 마무리를 도와줄 루틴이나 동료를 곁에 두세요.'],ENTP:['퀘이사','Quasar','아이디어를 쉬지 않고 뿜어내는 발명가','우주에서 가장 밝게 빛나는 퀘이사처럼 아이디어를 쉬지 않고 쏟아내요. 기존의 틀을 의심하고 뒤집어 보는 걸 즐기며, 토론을 통해 생각을 더 날카롭게 다듬어요. 남들이 당연하게 여기는 전제를 건드려 새로운 길을 여는 사람이에요.',['창의적인 문제 해결','빠른 두뇌 회전','토론과 설득력','변화를 기회로 보는 시각'],['재미로 한 반박이 상대에겐 공격처럼 들릴 수 있어요','아이디어 단계에서 흥미가 끝나기도 해요','규칙과 반복 업무를 견디기 어려워해요'],'자극이 없거나 아이디어가 무시당하면 산만해지고 사소한 일에 예민해져요.','대화가 통하는 사람에게 끌려요. 함께 웃고 논쟁하며 성장하는 관계가 이상적이에요.','새로운 걸 만들고 판을 바꾸는 일이 잘 맞아요. 창업, 전략 컨설팅, 기획, 연구, 마케팅, 법률 분야에서 빛나요.','아이디어 하나를 끝까지 데려가 보세요. 완성된 하나가 당신의 재능을 증명해 줄 거예요.'],ESTJ:['관제센터','Mission Control','모든 것이 제대로 돌아가게 만드는 관리자','모든 것이 제대로, 제때 돌아가게 만드는 사람이에요. 명확한 기준과 계획으로 사람과 자원을 조직하고 책임감 있게 결과를 만들어내요. 혼란스러운 상황에서 질서를 세우는 데 탁월해요.',['조직력과 리더십','결단력 있는 실행','분명한 기준과 책임감','현실적인 판단력'],['내 방식이 맞다는 확신이 강해 보일 수 있어요','효율을 앞세우다 감정을 놓치기도 해요','예상 밖의 변화에 답답함을 느껴요'],'통제가 무너지면 더 강하게 지시하게 되고, 쌓인 감정이 한꺼번에 터지기도 해요.','약속을 지키고 실질적으로 챙기는 것으로 사랑을 보여줘요. 믿음직한 버팀목 같은 연인이에요.','체계를 세우고 이끄는 자리에서 빛나요. 경영·관리, 운영, 금융, 공공 행정, 프로젝트 관리와 잘 맞아요.','결정 전에 ‘다른 사람은 이걸 어떻게 느낄까?’를 한 번만 물어보세요. 리더십이 더 단단해져요.'],ESFJ:['우주정거장','Space Station','모두가 머물고 싶은 따뜻한 거점','사람들 사이의 분위기를 섬세하게 살피고, 누구도 소외되지 않도록 챙기는 사람이에요. 공동체를 아끼고, 함께 잘 지내는 것을 가장 중요한 가치로 여겨요. 지친 사람들이 쉬어 가는 정거장 같은 존재예요.',['뛰어난 배려와 사교성','공동체를 묶는 힘','책임감 있는 실천','타인의 필요를 빠르게 알아차림'],['다른 사람의 평가에 크게 흔들릴 수 있어요','갈등 상황을 견디기 어려워해요','내 필요보다 남의 기대를 먼저 챙겨요'],'인정받지 못하거나 관계가 틀어지면 크게 상처받고 자신을 탓해요.','챙겨주고 함께하는 일상이 사랑이에요. 기념일과 작은 이벤트를 소중히 여기는 다정한 연인이에요.','사람을 돌보고 연결하는 일에서 빛나요. 교육, 의료, 인사, 서비스, 커뮤니티 운영, 행사 기획과 잘 맞아요.','모두를 만족시키지 못해도 괜찮아요. 당신도 챙김받아야 할 ‘모두’ 중 한 명이에요.'],ENFJ:['태양','The Sun','주변을 성장시키는 중심 항성','주변 행성들이 자연스럽게 공전하게 만드는 중심 항성 같은 사람이에요. 사람들의 가능성을 믿고, 그들이 성장하도록 이끄는 데서 큰 보람을 느껴요. 따뜻한 카리스마로 공동의 비전을 만들어내요.',['사람을 이끄는 카리스마','성장을 돕는 코칭 능력','뛰어난 공감과 소통','비전을 공유하는 힘'],['남의 문제를 내 문제처럼 떠안기 쉬워요','인정받고 싶은 마음에 무리하기도 해요','좋은 의도가 간섭으로 느껴질 때가 있어요'],'모두를 챙기다 지치면 갑자기 냉정해지거나 스스로를 비난해요.','상대의 성장을 진심으로 응원하는 연인이에요. 깊은 대화와 함께 그리는 미래를 중요하게 여겨요.','사람을 이끌고 성장시키는 일에서 빛나요. 교육, 코칭, 리더십, HR, 커뮤니케이션, 사회 공헌 분야와 잘 맞아요.','태양도 밤이 있어야 별이 보여요. 남을 비추는 만큼 스스로 쉬는 시간도 계획에 넣어 주세요.'],ENTJ:['함대 사령관','Fleet Commander','목표를 향해 함대를 이끄는 지휘관','목표를 정하면 함대를 이끌고 거침없이 나아가는 지휘관이에요. 큰 그림을 그리고, 그것을 실행 가능한 계획으로 바꿔 사람들을 움직여요. 도전적인 목표 앞에서 오히려 에너지가 솟아요.',['강력한 리더십','전략과 실행의 연결','결단력과 자신감','높은 기준과 성취욕'],['속도를 중시하다 사람의 감정을 지나칠 수 있어요','직설적인 말투가 위압적으로 느껴지기도 해요','쉬는 법을 잘 몰라요'],'목표가 흔들리면 더 강하게 밀어붙이고, 쌓인 감정이 예상치 못한 순간에 터져요.','함께 성장하는 파트너십을 원해요. 상대의 꿈을 현실로 만드는 계획을 같이 세워주는 타입이에요.','판을 짜고 이끄는 자리에서 빛나요. 경영, 창업, 전략, 컨설팅, 법률, 투자 분야와 잘 맞아요.','목표만큼 과정 속의 사람들을 봐 주세요. 함대는 신뢰로 움직일 때 가장 멀리 가요.']};
// 기준값은 sim.js(가상 응답자 50명 × 20회 = 1,000회) 결과로 보정함. 실제 응답 데이터가 모이면 다시 보정할 것
const CFG={band:57,lean:65,clear:76,flagMax:3,incMax:2.3,incHi:1.6,neuMax:56,neuNote:35,runMax:15,minSec:240,fw:0,xtrig:57,xn1:4,xseq:1,RTX:[[51,55],[53,65],[55,70],[57,75],[61,80],[63,85],[100,90]],RT:[[51,55],[53,60],[55,65],[57,75],[59,80],[63,85],[65,90],[72,95],[100,98]]};
const AXK=['EI','SN','TF','JP'],LISTS={EI:[],SN:[],TF:[],JP:[]},FAC={};
Q.forEach((q,i)=>{LISTS[q[0].slice(0,2)].push(i);(FAC[q[0]]=FAC[q[0]]||[]).push(i)});
const LX={EI:[],SN:[],TF:[],JP:[]},FACX={};QX.forEach((q,j)=>{LX[q[0].slice(0,2)].push(70+j);(FACX[q[0]]=FACX[q[0]]||[]).push(70+j)});
function item(i){return i<70?Q[i]:QX[i-70]}
const has=(an,i)=>an[i]!==undefined&&an[i]!==null;
const ORDER=[];for(let k=0;k<19;k++)AXK.forEach(a=>{if(k<LISTS[a].length)ORDER.push(LISTS[a][k])});
function scA(an,i){const s=3-an[i],q=item(i);return q[1]===AX[q[0].slice(0,2)].a?s:-s}
function clar(d){return d<=CFG.band?'경계형':d<=CFG.lean?'약간 기울어짐':d<=CFG.clear?'뚜렷함':'매우 뚜렷함'}
function rt(d,x){for(const [m,p] of (x?CFG.RTX:CFG.RT))if(d<=m)return p;return 98}
function score(an){const R={};let code='';
 AXK.forEach(a=>{const xs=LX[a].filter(i=>has(an,i)),ids=LISTS[a].concat(xs),x=AX[a],ss=ids.map(i=>scA(an,i)),fac={},fm=[];
  [1,2,3,4].forEach(f=>{const fi=FAC[a+f].concat(FACX[a+f].filter(i=>has(an,i))),m=fi.reduce((s,i)=>s+scA(an,i),0)/fi.length;fm.push(m);fac[a+f]=Math.round(50+m/3*50)});
  let raw=CFG.fw?fm.reduce((s,v)=>s+v,0)/4:ss.reduce((s,v)=>s+v,0)/ids.length;
  if(Math.abs(raw)<1e-9)raw=0;
  let pa=Math.round(50+raw/3*50);if(raw>0&&pa<51)pa=51;if(raw<0&&pa>49)pa=49;
  const np=ss.filter(v=>v>0).length,nn=ss.filter(v=>v<0).length;
  const L=raw>0?x.a:raw<0?x.b:(np>=nn?x.a:x.b),isA=L===x.a;
  const al=ids.map(i=>[i,isA?scA(an,i):-scA(an,i)]);
  R[a]={pa,L,fac,raw,n:ids.length,x:xs.length,ev:al.filter(v=>v[1]>=2).sort((u,w)=>w[1]-u[1]).slice(0,2),opp:al.filter(v=>v[1]<0).length,d:Math.max(pa,100-pa)};code+=L});
 return {code,R}}
function quality(an,sec){
 const v=PAIRS.map(([x,y])=>[scA(an,x),scA(an,y)]);
 const flag=v.filter(([p,q])=>p*q<0&&Math.abs(p-q)>=4).length;
 let sd=0,np=0;Object.keys(FAC).forEach(k=>{const fi=FAC[k];for(let i=0;i<fi.length;i++)for(let j=i+1;j<fi.length;j++){sd+=Math.abs(scA(an,fi[i])-scA(an,fi[j]));np++}});
 const inc=sd/np,cons=inc<=CFG.incHi?'높음':inc<=CFG.incMax?'보통':'낮음';
 const neu=Q.filter((_,i)=>an[i]===3).length;
 let run=1,best=1;for(let k=1;k<ORDER.length;k++){if(an[ORDER[k]]===an[ORDER[k-1]]){run++;if(run>best)best=run}else run=1}
 const warn=[];
 if(flag>CFG.flagMax||inc>CFG.incMax)warn.push('mix');
 if(neu>CFG.neuMax)warn.push('neu');
 if(best>CFG.runMax)warn.push('run');
 if(typeof sec==='number'&&sec<CFG.minSec)warn.push('fast');
 return {flag,inc,cons,neu,best,sec,warn,ok:!warn.length,note:neu>CFG.neuNote&&neu<=CFG.neuMax}}
// 적응형 추가 문항: 70문항 기준 경계형 축만 1단계(측면마다 1문항, A방향 2:2)를 묻고, 단계형이면 1단계를 합쳐도 경계형인 축에만 2단계를 묻는다
function xIL(ls){const o=[];for(let k=0;k<8;k++)ls.forEach(l=>{if(k<l.length)o.push(l[k])});return o}
function xPlan(an){const b={};for(let i=0;i<70;i++)if(has(an,i))b[i]=an[i];

 if(!CFG.xseq||!l1.every(i=>has(an,i)))return {ax1,ax2:[],list:l1,n1:l1.length};
 l1.forEach(i=>b[i]=an[i]);const r1=score(b),ax2=ax1.filter(a=>r1.R[a].d<=CFG.xtrig);
 return {ax1,ax2,list:l1.concat(xIL(ax2.map(a=>LX[a].slice(CFG.xn1)))),n1:l1.length}}
function xNext(an){return xPlan(an).list.filter(i=>!has(an,i))}
function xClean(an){const p=xPlan(an).list;Object.keys(an).forEach(k=>{if(+k>=70&&!p.includes(+k))delete an[k]})}

SN1a:['직접 확인한 사실과 데이터를 믿어요. 근거 없는 주장에 쉽게 휘둘리지 않아요.','결정할 일 하나에 대해 직감을 한 줄 적어 두고, 나중에 맞았는지 확인해 보세요. 직감도 쓸 만한 정보인지 알게 돼요.'],
SN1b:['말 사이의 의도와 패턴을 빨리 읽어요. 다만 근거보다 해석이 앞서 오해가 생기기도 해요.','오늘 판단 하나를 ‘확인된 사실’과 ‘내 해석’ 두 칸으로 나눠 적어 보세요.'],
SN2a:['지금 할 수 있는 현실적인 일에 집중해요. 실행력은 좋지만 장기 방향이 흐려질 수 있어요.','1년 뒤 내 모습을 세 문장으로 적어 보세요. 지금의 실행력에 방향이 생겨요.'],
SN2b:['미래와 가능성을 자주 상상해요. 비전은 크지만 오늘 할 일이 뒤로 밀리기 쉬워요.','머릿속 큰 계획 하나에 ‘오늘 15분 안에 할 수 있는 첫 행동’을 붙여 바로 해 보세요.'],
SN3a:['구체적인 예시와 단계로 이해해요. 설명서와 실습이 있으면 누구보다 정확하게 익혀요.','최근 익힌 일 하나에 대해 ‘이 단계들이 왜 이런 순서일까?’를 정리해 보세요. 응용력이 붙어요.'],
SN3b:['큰 그림과 원리로 이해해요. 구조를 빨리 잡지만 세부 단계를 건너뛰기 쉬워요.','이해했다고 느낀 내용을 구체적인 예시 하나로 설명해 보세요. 설명이 막히는 곳이 아직 덜 이해한 부분이에요.'],
SN4a:['검증된 방식으로 안정적인 결과를 내요. 새로운 방식에는 충분한 근거가 있어야 움직여요.','실패해도 괜찮은 작은 영역에서 새로운 방법 하나를 시험해 보세요. 안 먹어본 메뉴나 새 앱 하나부터요.'],
SN4b:['새로운 방식과 변화에서 활력을 얻어요. 다만 잘 되던 것까지 바꾸려다 에너지를 낭비할 수 있어요.','바꾸고 싶은 것 하나에 대해 ‘지금 방식의 진짜 문제는 무엇인가’를 한 줄로 써 보세요. 쓸 수 없다면 그대로 두는 것도 실력이에요.'],
TF1a:['논리와 합리성으로 결정해요. 공정하지만 결정에 영향을 받는 사람의 마음을 놓칠 수 있어요.','최근 내린 결정 하나를 떠올리고, 가장 영향을 받은 사람에게 할 한 문장을 준비해 보세요.'],
TF1b:['사람과 의미를 기준으로 결정해요. 따뜻하지만 객관적인 비용을 과소평가할 수 있어요.','마음이 기우는 선택 하나의 장단점을 표로 적어 보세요. 마음이 맞는지 확인하는 과정이에요.'],
TF2a:['솔직하고 명확하게 말해요. 신뢰를 얻지만 의도보다 날카롭게 들릴 때가 있어요.','오늘 피드백 하나를 ‘좋은 점 하나, 바꿀 점 하나, 구체적 제안’ 순서로 말해 보세요. 내용은 그대로, 전달력은 훨씬 좋아져요.'],
TF2b:['상대가 받아들일 수 있게 말하는 데 능숙해요. 다만 핵심이 흐려져 상대가 문제를 모를 수 있어요.','부드럽게 말하되 마지막 문장은 ‘그래서 이 부분은 꼭 바꿔 줘’처럼 분명하게 끝내 보세요.'],
TF3a:['문제를 해결해 주는 방식으로 도와요. 실질적이지만 상대가 위로를 원할 때는 엇갈릴 수 있어요.','누군가 고민을 털어놓으면 먼저 ‘해결책이 필요해, 아니면 들어 주길 원해?’라고 물어보세요.'],
TF3b:['마음을 먼저 알아주는 방식으로 도와요. 큰 위로가 되지만 문제 자체는 그대로 남을 때도 있어요.','공감한 뒤에 ‘내가 도울 수 있는 일이 있을까?’ 한 문장을 덧붙여 보세요. 위로가 행동으로 이어져요.'],
TF4a:['같은 기준을 모두에게 적용하는 것이 공정하다고 봐요. 일관되지만 딱한 사정 앞에서 냉정해 보일 수 있어요.','규칙을 적용하기 전에 ‘이 규칙이 원래 지키려던 목적은 무엇인가’를 한 번 생각해 보세요.'],
TF4b:['각자의 사정을 헤아리는 것이 공정하다고 봐요. 따뜻하지만 예외가 쌓이면 다른 사람에게 불공평해질 수 있어요.','예외를 두고 싶을 때 ‘다른 사람에게도 같은 예외를 줄 수 있나?’를 스스로 물어보세요.'],
JP1a:['미리 계획해야 마음이 편해요. 준비성은 뛰어나지만 계획이 틀어지면 스트레스가 커요.','이번 주 계획표에 일부러 빈칸 시간을 두 칸 넣어 두세요. 변수가 생겨도 계획 안에서 처리돼요.'],
JP1b:['흐름에 맡길 때 자연스러워요. 적응력이 좋지만 중요한 일이 뒤로 밀릴 수 있어요.','아침에 ‘오늘 꼭 할 일 1개’만 정하고 시작해 보세요. 하루 전체를 계획할 필요는 없어요.'],
JP2a:['미리미리 순서대로 끝내요. 마감 걱정은 없지만 끝난 일도 계속 다듬느라 지칠 수 있어요.','진행 중인 일 하나를 완성도 80%에서 먼저 공유해 피드백을 받아 보세요. 혼자 100%를 만드는 것보다 빨라요.'],
JP2b:['마감 압박에서 집중력이 살아나요. 결과는 내지만 막판 변수에 취약해요.','다음 마감 3일 전에 나만의 가짜 마감을 캘린더에 넣어 보세요. 압박의 힘은 살리고 위험은 줄여요.'],
JP3a:['빨리 결정하고 마무리해야 편해요. 추진력이 있지만 더 좋은 선택지를 놓칠 수 있어요.','오늘 내린 결정 하나를 하룻밤만 묵혀 보세요. 그래도 같다면 확신을 갖고 가면 돼요.'],
JP3b:['가능성을 열어두는 걸 좋아해요. 유연하지만 결정이 늦어져 주변이 기다리게 될 수 있어요.','미뤄 둔 결정 하나에 ‘언제까지 정할지’ 날짜부터 정해 보세요.'],
JP4a:['정돈된 환경과 루틴에서 컨디션이 좋아요. 루틴이 깨지면 하루 전체가 흔들리기 쉬워요.','루틴이 깨진 날을 위한 최소 루틴 3가지를 정해 두세요. 그것만 해도 오늘은 성공이에요.'],
JP4b:['유연하고 자유로운 생활이 편해요. 다만 물건과 일정을 찾느라 시간을 쓰기도 해요.','열쇠, 지갑, 충전기처럼 자주 찾는 물건 3개만 고정 자리를 정해 보세요. 자유는 지키고 낭비는 줄여요.']};
const BRS={E:'둘 다 말하며 생각해요. 대화가 빠르게 불붙지만, 둘 다 말만 하고 정리는 안 할 수 있어요.',I:'둘 다 혼자만의 시간을 존중해요. 편안하지만 중요한 이야기를 서로 미루기 쉬워요.',S:'둘 다 현실적이에요. 일이 착착 진행되지만 새로운 시도는 둘 다 망설일 수 있어요.',N:'둘 다 아이디어를 좋아해요. 대화가 끝없이 확장되지만 실행 담당이 비기 쉬워요.',T:'둘 다 논리로 대화해요. 효율적이지만 서운함이 쌓여도 서로 못 알아챌 수 있어요.',F:'둘 다 마음을 먼저 살펴요. 따뜻하지만 불편한 이야기를 둘 다 피할 수 있어요.',J:'둘 다 계획을 좋아해요. 든든하지만 계획이 서로 다를 때 둘 다 양보하지 않을 수 있어요.',P:'둘 다 유연해요. 즐겁지만 정해지는 게 없어 일이 밀릴 수 있어요.'};
const BRD={EI:'상대는 생각할 시간이 필요해요. 중요한 질문은 미리 보내고, 즉답을 재촉하지 마세요.',IE:'상대는 말하며 생각을 정리해요. 상대의 말을 최종 결론으로 받아들이지 말고, 내 생각도 짧게라도 먼저 꺼내 보세요.',SN:'상대는 큰 그림부터 말해요. ‘그래서 첫 단계는 뭐야?’라고 물어 아이디어를 현실로 끌어와 주세요.',NS:'상대는 구체적인 사실을 원해요. 아이디어를 말할 때 예시 하나와 다음 단계를 함께 제시하세요.',TF:'상대는 말의 온도에 민감해요. 지적하기 전에 노력을 한 문장 인정해 주면 같은 말도 훨씬 잘 전달돼요.',FT:'상대는 직설이 기본값이에요. 차갑게 들려도 대개 악의는 없어요. 서운하면 감정보다 구체적인 사실로 말해 보세요.',JP:'상대는 열린 상태가 편해요. 마감과 꼭 정할 것만 분명히 하고 나머지는 맡겨 주세요.',PJ:'상대는 정해져야 편해요. 계획 변경은 미리 알리고, 확답할 수 있는 날짜를 먼저 약속해 주세요.'};

 return `<div class='glass pad fade' style='margin-top:12px'><p style='font-size:17px;font-weight:700'>${me} ↔ ${you} · ${TY[you][0]}</p><p class='mu' style='font-size:14px;line-height:1.7;margin:6px 0 4px'>${head}</p>${AXK.map((a,i)=>`<div class='li'><b>${m[i]===y[i]?'＝':'≠'}</b><span><strong style='font-weight:600'>${AX[a].n} · ${m[i]} ${m[i]===y[i]?'＝':'↔'} ${y[i]}</strong><br>${m[i]===y[i]?BRS[m[i]]:BRD[m[i]+y[i]]}</span></div>`).join('')}</div>`}

function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}
function wrap(x,text,X,Y,maxW,lh){let line='',yy=Y;for(const ch of text){const t=line+ch;if(x.measureText(t).width>maxW&&line){x.fillText(line,X,yy);line=ch;yy+=lh}else line=t}if(line)x.fillText(line,X,yy);return yy}
